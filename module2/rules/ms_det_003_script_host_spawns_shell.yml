title: Moteur de script Windows qui lance un interpréteur de commandes
id: 25e5fc01-6da2-46c2-85ac-35927278936c
status: experimental
description: >
  Détecte wscript.exe, cscript.exe ou mshta.exe qui lancent PowerShell ou cmd.
  Typique d'une pièce jointe piégée (.vbs, .js, .hta) ouverte par un utilisateur.
references:
  - https://attack.mitre.org/techniques/T1059/005/
author: Elie MEHINTO
date: 2026-11-19
tags:
  - attack.execution
  - attack.t1059.005
  - attack.t1204.002
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
  selection_enfant:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\cmd.exe'
  condition: selection_parent and selection_enfant
falsepositives:
  - Scripts de connexion ou d'administration internes lancés par wscript (à recenser au module 4)
level: high
