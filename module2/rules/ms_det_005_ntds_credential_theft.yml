title: Préparation du vol de la base Active Directory (cliché instantané ou sauvegarde de ruche)
id: 1b594128-466e-4c40-9eed-cbd339b5f985
status: experimental
description: >
  Détecte la création d'un cliché instantané avec vssadmin, ou la sauvegarde des
  ruches SYSTEM, SAM ou SECURITY avec reg save. Ces étapes permettent de copier
  NTDS.dit et la clé de déchiffrement pour casser hors ligne les mots de passe du domaine.
references:
  - https://attack.mitre.org/techniques/T1003/003/
author: Elie MEHINTO
date: 2026-11-19
tags:
  - attack.credential-access
  - attack.t1003.003
  - attack.t1003.002
logsource:
  product: windows
  category: process_creation
detection:
  selection_vss:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains: 'create shadow'
  selection_reg:
    Image|endswith: '\reg.exe'
    CommandLine|contains: ' save '
  selection_ruche:
    CommandLine|contains:
      - '\SYSTEM'
      - '\SAM'
      - '\SECURITY'
      - '\system'
      - '\sam'
      - '\security'
  condition: selection_vss or (selection_reg and selection_ruche)
falsepositives:
  - Logiciels de sauvegarde qui créent des clichés instantanés (à recenser au module 4)
level: high
